# iOS CircleCI 2.0 configuration file
# https://circleci.com/docs/configuration-reference/
#
# For XCode build version available
# https://circleci.com/docs/using-macos/
version: 2.1

check_sdk_version: &check_sdk_version
  name: Check SdkVersion.swift is in sync with version.rb
  command: |
    EXPECTED=$(ruby -r ./version.rb -e 'puts $VERSION')
    ACTUAL=$(grep -oE '"[^"]+"' Sources/Core/Classes/SdkVersion.swift | tr -d '"')
    if [ "$EXPECTED" != "$ACTUAL" ]; then
      echo "SdkVersion.swift ($ACTUAL) is out of sync with version.rb ($EXPECTED). Run ./set_version.sh and commit the result."
      exit 1
    fi
    echo "SdkVersion.swift is in sync with version.rb ($EXPECTED)"

jobs:
  build:
    macos:
      xcode: "16.4.0"
    steps:
      - checkout
      - run: *check_sdk_version
      # Builds for the device architecture, which the simulator-bound `test`
      # job below does not cover.
      - run:
          name: Build Reach5
          command: xcodebuild build -scheme Reach5 -destination 'generic/platform=iOS'
  test:
    parameters:
      xcode:
        type: string
      simulators:
        # The `-destination` flags for the two iOS runtimes this image ships, from its manifest.
        # `OS=` is required: a `name=` alone only ever resolves against the newest runtime.
        type: string
    macos:
      xcode: << parameters.xcode >>
    steps:
      - checkout
      - run:
          name: Run the Reach5Tests suite on both iOS simulators
          command: xcodebuild -scheme Reach5 << parameters.simulators >> -resultBundlePath /tmp/reach5-test-results.xcresult test
      # Temporary: TmpHostProbe (print-based) produced no output in this step's own log on either
      # device, passing or failing — CircleCI does not capture the test process's stdout here. The
      # crash detail for testHostlessAuthorityIsNilNotEmpty on iOS 17.5 should be in the .xcresult
      # instead. Drop this and the bundle path above once explained.
      - store_artifacts:
          path: /tmp/reach5-test-results.xcresult
          destination: reach5-test-results.xcresult
          when: always
      - run:
          name: Run the same suite on Mac Catalyst
          # The destination the team uses locally, so CI covers what they see.
          command: xcodebuild -scheme Reach5 -destination 'platform=macOS,variant=Mac Catalyst' test
  check-doc-examples:
    macos:
      xcode: "16.4.0"
    steps:
      - checkout
      - run:
          name: Type-check the documentation code examples against the API
          command: bash docs/verification/check.sh
      - store_artifacts:
          path: docs/verification/report.md
          destination: doc-examples-report.md
  ci-passed:
    # Single fan-in job so the GitHub required status check has one stable name
    # regardless of how many CircleCI jobs run — add new jobs to `requires`
    # below instead of touching branch protection settings again.
    docker:
      - image: cimg/base:current
    steps:
      - run: echo "build and test passed"

default_workflows_tags: &default_workflows_tags
  filters:
    tags:
      only: /.*/

# check-doc-examples only needs to run when preparing a release (branch named
# after the version, per RELEASE.md) — not on every PR,
# and not on the tag: under SPM the tag itself is the publication
release_branches: &release_branches
  filters:
    branches:
      only: /^[0-9]+\.[0-9]+\.[0-9]+$/

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build:
          <<: *default_workflows_tags
      # One job per Xcode image, each running the suite on the two iOS runtimes that image
      # ships — a runtime is free, an image costs a VM, so the images are boundaries rather
      # than an exhaustive list: oldest able to build this package, last before Xcode 26,
      # newest stable. The 27.0 image stays out while its build number says beta.
      #
      # The floor is Xcode 16.0, not what `swift-tools-version: 5.10` alone would suggest
      # (Xcode 15.3+): `Async.swift` uses typed throws (`throws(E)`), a Swift 6.0 feature, and
      # Xcode 15.4 (Swift 5.10) fails to parse it. CircleCI's catalog has no 16.0–16.3 image,
      # so 16.4.0 is already the oldest one this package builds on.
      #
      # Simulator names and OS versions are read from the image manifests, linked per image
      # from https://circleci.com/docs/using-macos/ :
      - test:
          name: test-xcode-16.4
          xcode: "16.4.0"
          # https://circle-macos-docs.s3.amazonaws.com/image-manifest/v15338/manifest.txt
          simulators: "-destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5'"
          <<: *default_workflows_tags
      - test:
          name: test-xcode-26.6
          xcode: "26.6"
          # https://circle-macos-docs.s3.amazonaws.com/image-manifest/v18807/manifest.txt
          simulators: "-destination 'platform=iOS Simulator,name=iPhone 16,OS=18.6' -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'"
          <<: *default_workflows_tags
      - check-doc-examples:
          <<: *release_branches
      - build-for-release:
          <<: *default_workflows_filters
      - publish:
          requires:
            - build-for-release
            - test-xcode-16.4
            - test-xcode-26.6
          <<: *default_workflows_filters
      - ci-passed:
          <<: *default_workflows_tags
          requires:
            - build
            - test-xcode-16.4
            - test-xcode-26.6

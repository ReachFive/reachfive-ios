# iOS CircleCI 2.0 configuration file
# https://circleci.com/docs/configuration-reference/
#
# For XCode build version available
# https://circleci.com/docs/using-macos/
version: 2.1

check_sdk_version: &check_sdk_version
  name: Check SdkVersion.swift is in sync with version.rb
  command: |
    EXPECTED=$(ruby -r ./version.rb -e 'puts $VERSION')
    ACTUAL=$(grep -oE '"[^"]+"' Sources/Core/Classes/SdkVersion.swift | tr -d '"')
    if [ "$EXPECTED" != "$ACTUAL" ]; then
      echo "SdkVersion.swift ($ACTUAL) is out of sync with version.rb ($EXPECTED). Run ./set_version.sh and commit the result."
      exit 1
    fi
    echo "SdkVersion.swift is in sync with version.rb ($EXPECTED)"

jobs:
  build:
    macos:
      xcode: "16.4.0"
    steps:
      - checkout
      - run: *check_sdk_version
      # Builds for the device architecture, which the simulator-bound `test`
      # job below does not cover.
      - run:
          name: Build Reach5
          command: xcodebuild build -scheme Reach5 -destination 'generic/platform=iOS'
  test:
    macos:
      xcode: "16.4.0"
    steps:
      - checkout
      # The destination has to name a concrete simulator: xcodebuild refuses
      # "generic/platform=iOS Simulator" for the test action ("Tests must be run
      # on a concrete device"). The name below is the one shipped by the Xcode
      # image pinned just above, so update both together.
      - run:
          name: Run the Reach5Tests suite
          command: xcodebuild -scheme Reach5 -destination 'platform=iOS Simulator,name=iPhone 16 Pro' test
  check-doc-examples:
    macos:
      xcode: "16.4.0"
    steps:
      - checkout
      - run:
          name: Type-check the documentation code examples against the API
          command: bash docs/verification/check.sh
      - store_artifacts:
          path: docs/verification/report.md
          destination: doc-examples-report.md

default_workflows_tags: &default_workflows_tags
  filters:
    tags:
      only: /.*/

# check-doc-examples only needs to run when preparing a release (branch named
# after the version, per RELEASE.md) — not on every PR (counter-productive,
# see #146), and not on the tag: under SPM the tag itself is the publication,
# resolved by consumers before any CircleCI pipeline on it even starts.
release_branches: &release_branches
  filters:
    branches:
      only: /^[0-9]+\.[0-9]+\.[0-9]+$/

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build:
          <<: *default_workflows_tags
      - test:
          <<: *default_workflows_tags
      - check-doc-examples:
          <<: *release_branches
